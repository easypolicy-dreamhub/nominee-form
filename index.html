<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nominee Form Filler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --bg:#F2F0EE; --surface:#FFFFFF; --surface2:#F8F6F5; --ink:#2A1F1F; --muted:#6E6262; --line:#E1DAD8;
  --brand:#8E2B2B; --brand-ink:#FFFFFF; --brand-soft:#F6E7E5;
  --ok:#2E6B4E; --ok-soft:#E4F1EA; --warn:#9A5B0B; --warn-soft:#FBF0DE; --err:#B3261E; --err-soft:#FBE6E4; --info:#3B5A80; --info-soft:#E6EDF6;
  --font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171313; --surface:#211B1B; --surface2:#2A2323; --ink:#EFE7E6; --muted:#B0A3A2; --line:#3A3131;
  --brand:#D9776F; --brand-ink:#1E1010; --brand-soft:#3A2423;
  --ok:#6FC79A; --ok-soft:#1E3329; --warn:#E3AE57; --warn-soft:#3A2D18; --err:#F08A80; --err-soft:#3F2220; --info:#93B3DB; --info-soft:#1F2A39; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#171313; --surface:#211B1B; --surface2:#2A2323; --ink:#EFE7E6; --muted:#B0A3A2; --line:#3A3131;
  --brand:#D9776F; --brand-ink:#1E1010; --brand-soft:#3A2423;
  --ok:#6FC79A; --ok-soft:#1E3329; --warn:#E3AE57; --warn-soft:#3A2D18; --err:#F08A80; --err-soft:#3F2220; --info:#93B3DB; --info-soft:#1F2A39; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.title{font-weight:600;font-size:16px;line-height:1.2}
.title small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.ver{font-size:12.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand);border-radius:999px;padding:3px 10px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
.sechd{display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sechd h2{margin:0;font-size:17px;font-weight:600}
.sechd .step{color:var(--brand);font-weight:700;font-size:15px;min-width:20px}
.sechd p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%;padding-left:32px}
.secbd{padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.c2,.c3{grid-column:span 2}.c4,.c6{grid-column:span 2}.c1m{grid-column:span 1}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f .hint{font-weight:400;font-size:12px}
input[type=text],input[type=date],input[type=number],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:8px 10px;font-size:15px;color:var(--ink);min-height:40px}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input.up{text-transform:uppercase}
input::placeholder,textarea::placeholder{text-transform:none;color:var(--muted);opacity:.7}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;color:var(--ink);background:var(--surface);font-weight:400}
.seg input:checked+span{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.fieldset{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.person{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--surface2)}
.person:last-child{margin-bottom:0}
.phd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.phd b{font-size:15px}
.phd .tag{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.side{position:sticky;top:76px}
@media (max-width:920px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.panel h3{margin:0;padding:12px 16px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel h3 .count{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:8px}
.checks li{display:flex;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;line-height:1.4;margin-bottom:4px}
.checks li .dot{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.checks li.ok{background:var(--ok-soft)}.checks li.ok .dot{background:var(--ok);color:var(--surface)}
.checks li.warn{background:var(--warn-soft)}.checks li.warn .dot{background:var(--warn);color:var(--surface)}
.checks li.err{background:var(--err-soft)}.checks li.err .dot{background:var(--err);color:var(--surface)}
.checks li.info{background:var(--info-soft)}.checks li.info .dot{background:var(--info);color:var(--surface)}
.pages{padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap}
.pg{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;text-align:center;min-width:46px;color:var(--muted);background:var(--surface2)}
.pg.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.gen{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.gen .btn{width:100%;padding:11px 14px;font-size:15px}
.status{font-size:13px;color:var(--muted);min-height:1em}
.status.err{color:var(--err)}.status.ok{color:var(--ok)}
.drafts{padding:8px 16px 14px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.draft{display:flex;align-items:center;gap:8px;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.draft .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draft .dt{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none!important}
.addrprev{border:1px dashed var(--line);border-radius:8px;padding:9px 12px;font-size:14px;background:var(--surface);line-height:1.45}
.addrprev span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
@media (max-width:640px){.topin{flex-wrap:wrap;padding:8px 14px;gap:8px 10px}.mark{display:none}.title{white-space:nowrap}.topin .spacer{flex-basis:100%;height:0}.title small{display:none}.ver{font-size:11.5px;padding:2px 8px}.topin .btn{padding:6px 10px;font-size:13px}.wrap{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="mark">N</div>
  <div class="title">Nominee Form Filler<small>Great Eastern · Appointment / Change of Nominee(s) / Trustee(s)</small></div>
  <span class="ver" title="Version of the Great Eastern form this app prints. Compare with the code in the left margin of page 1 of the latest form.">Form V07-082025</span>
  <div class="spacer"></div>
  <button class="btn" id="btnSave">Save draft</button>
  <button class="btn" id="btnNew">New form</button>
</div></header>

<div class="wrap">
<main id="main"></main>
<aside class="side">
  <div class="panel">
    <h3>Form checks <span class="count" id="checkCount"></span></h3>
    <ul class="checks" id="checks"></ul>
    <div class="pages" id="pages" aria-label="Pages that will be filled"></div>
    <div class="gen">
      <button class="btn primary" id="btnGen">Generate PDF for printing</button>
      <div class="status" id="genStatus" role="status"></div>
    </div>
  </div>
  <div class="panel">
    <h3>Saved drafts <span class="count">on this device</span></h3>
    <div class="drafts" id="drafts"></div>
  </div>
</aside>
</div>
<div class="toast" id="toast"></div>

function fillForm(PDFLib, pdfBytes, MAP, V) {
  return (async () => {
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.load(pdfBytes);
    const font = await doc.embedFont(StandardFonts.Helvetica);
    const pages = doc.getPages();
    const H = 842, ink = rgb(0.05, 0.1, 0.35);
    const safe = s => String(s == null ? '' : s).toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\x20-\x7E]/g, '?');
    const putCells = (cells, text) => {
      const t = safe(text);
      for (let i = 0; i < cells.length && i < t.length; i++) {
        const ch = t[i]; if (ch === ' ') continue;
        const [p, x0, x1, top, bot] = cells[i];
        const h = bot - top, size = Math.min(9, h * 0.66);
        const w = font.widthOfTextAtSize(ch, size);
        pages[p - 1].drawText(ch, { x: (x0 + x1) / 2 - w / 2, y: H - bot + (h - size * 0.72) / 2, size, font, color: ink });
      }
    };
    // wrap words into rows of `per` chars, padding so each row starts on a new line of cells
    const wrapCells = (cells, text, per) => {
      const words = safe(text).trim().split(/\s+/).filter(Boolean);
      const rows = []; let cur = '';
      for (const w of words) {
        if (!cur) cur = w;
        else if ((cur + ' ' + w).length <= per) cur += ' ' + w;
        else { rows.push(cur); cur = w; }
        while (cur.length > per) { rows.push(cur.slice(0, per)); cur = cur.slice(per); }
      }
      if (cur) rows.push(cur);
      putCells(cells, rows.map(r => r.padEnd(per, ' ')).join(''));
      return rows.length * per <= cells.length;
    };
    const rowLen = cells => { let n = 1; while (n < cells.length && cells[n][3] === cells[0][3]) n++; return n; };
    const tick = b => {
      const [p, x, top, w, h] = b, pg = pages[p - 1];
      const y0 = H - top - h, s = Math.min(w, h);
      const ox = x + (w - s) / 2, oy = y0 + (h - s) / 2;
      const o = { thickness: Math.max(1, s / 8), color: ink };
      pg.drawLine({ start: { x: ox + s * .18, y: oy + s * .5 }, end: { x: ox + s * .42, y: oy + s * .2 }, ...o });
      pg.drawLine({ start: { x: ox + s * .42, y: oy + s * .2 }, end: { x: ox + s * .85, y: oy + s * .85 }, ...o });
    };
    const putText = (r, text) => {
      const t = safe(text); if (!t) return;
      const [p, x, top, w, h] = r;
      let size = Math.min(9, h * 0.62);
      while (size > 4.5 && font.widthOfTextAtSize(t, size) > w - 4) size -= 0.25;
      pages[p - 1].drawText(t, { x: x + 2, y: H - top - h + (h - size * 0.72) / 2, size, font, color: ink });
    };
    const warnings = [];
    for (const [k, v] of Object.entries(V.cells || {})) {
      const cells = k === 'proposalNo' || k === 'policyNo' ? null : MAP.cells[k];
      if (k === 'proposalNo' || k === 'policyNo') { for (const c of MAP.repeat[k]) putCells(c, v); continue; }
      if (!cells || v == null || v === '') continue;
      const per = rowLen(cells);
      if (per < cells.length) { if (!wrapCells(cells, v, per)) warnings.push(k); }
      else { if (safe(v).length > cells.length) warnings.push(k); putCells(cells, v); }
    }
    for (const k of V.ticks || []) if (MAP.box[k]) tick(MAP.box[k]);
    for (const [k, v] of Object.entries(V.text || {})) if (MAP.text[k]) putText(MAP.text[k], v);
    const out = await doc.save();
    return { bytes: out, warnings };
  })();
}

function wrapRows(text,per){const words=String(text||'').toUpperCase().trim().split(/\s+/).filter(Boolean);const rows=[];let cur='';for(const w of words){if(!cur)cur=w;else if((cur+' '+w).length<=per)cur+=' '+w;else{rows.push(cur);cur=w}while(cur.length>per){rows.push(cur.slice(0,per));cur=cur.slice(per)}}if(cur)rows.push(cur);return rows.length}

function date(path,label,o={}){return `<label class="f ${o.cls||''}">${esc(label)}<input type="date" data-k="${path}" value="${esc(get(path)||'')}"></label>`}
function seg(path,label,opts,o={}){const v=String(get(path));const nm=path.replace(/\./g,'_');return `<div class="fieldset ${o.cls||''}">${esc(label)}<div class="seg">${opts.map(([val,lab])=>`<label><input type="radio" name="${nm}" data-k="${path}" value="${val}" ${v===val?'checked':''} ${o.rerender?'data-rr="1"':''}><span>${esc(lab)}</span></label>`).join('')}</div></div>`}

const ADDR_KEYS=['addr','postcode','town','country'];
function addrRoot(i,depth=0){const n=S.nominees[i];if(!n||depth>4)return i;const f=n.addrFrom;return (f!=null&&f<i&&S.nominees[f])?addrRoot(f,depth+1):i;}
function addrOf(i){const r=S.nominees[addrRoot(i)];return {addr:r.addr||'',postcode:r.postcode||'',town:r.town||'',country:r.country||''};}
const addrKey=a=>[a.addr,a.postcode,a.town,a.country].map(x=>String(x||'').toUpperCase().replace(/[\s,.]+/g,' ').trim()).join('|');
const addrShort=a=>[String(a.addr||'').replace(/\s*\n\s*/g,', '),[a.postcode,a.town].filter(Boolean).join(' ')].filter(Boolean).join(', ');
// distinct addresses among nominees before i: [{root, members:[idx...], a}]
function addrGroups(i){const G=[];for(let j=0;j<i;j++){const a=addrOf(j);if(!String(a.addr).trim())continue;const k=addrKey(a);let g=G.find(x=>x.k===k);if(!g){g={k,root:addrRoot(j),members:[],a};G.push(g)}g.members.push(j)}return G;}
const listNums=m=>{const n=m.map(x=>x+1);return n.length===1?`Nominee ${n[0]}`:`Nominees ${n.slice(0,-1).join(', ')} & ${n[n.length-1]}`};
function nomAddr(i){const n=S.nominees[i];if(i===0)return addrFields('nominees.0');
  const G=addrGroups(i);if(!G.length){n.addrFrom=null;return addrFields(`nominees.${i}`);}
  const linked=n.addrFrom!=null&&S.nominees[n.addrFrom]&&n.addrFrom<i;
  const curK=linked?addrKey(addrOf(i)):null;
  const opts=[['own','Enter a different address'],...G.map(g=>['g'+g.root,`Same as ${listNums(g.members)}`])];
  const curVal=linked?('g'+(G.find(g=>g.k===curK)||{root:n.addrFrom}).root):'own';
  return `<label class="f c6">Mailing address<select data-addrsel="${i}">${opts.map(([v,l])=>`<option value="${v}" ${v===curVal?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
   ${linked?`<div class="c6 addrprev"><b data-prev="${i}" style="font-weight:500">${esc(prevText(i))}</b><span>Updates automatically if that address is edited.</span></div>`:addrFields(`nominees.${i}`)}`;}
const prevText=i=>{const a=addrOf(i);return (addrShort(a)+(a.country?', '+a.country:'')).toUpperCase()};
function unlinkAddr(i,copy){const n=S.nominees[i];if(n.addrFrom==null)return;const a=addrOf(i);n.addrFrom=null;if(copy&&!String(n.addr||'').trim()&&!n.postcode&&!n.town)Object.assign(n,a);}

   <div class="grid">${txt(`consent.people.${i}.name`,'Name',{cls:'c4'})}${txt(`consent.people.${i}.id`,'NRIC/passport no.',{cls:'c2',max:14})}</div></div>`).join('')+(c.people.length<4?`<button class="btn" data-act="addCon">Add person</button>`:'')):'';
  const s=S.sign;
  document.getElementById('main').innerHTML=`
  <section class="sec"><div class="sechd"><span class="step">1</span><h2>Policy and policyowner</h2><p>Fill whichever number you have. It's printed on every page.</p></div>
   <div class="secbd"><div class="grid">
    ${txt('proposalNo','Proposal no.',{cls:'c3',max:10})}
    ${txt('policyNo','Policy no.',{cls:'c3',max:10})}
    ${txt('owner.name','Policyowner full name as per NRIC/passport',{cls:'c4',max:27})}
    ${txt('owner.id','NRIC (12 digits) / passport no.',{cls:'c2',max:14,ph:'900101-14-5678'})}
    ${seg('owner.muslim','Muslim?',[['no','No'],['yes','Yes']],{cls:'c2',rerender:true})}
    ${seg('owner.status','Status',[['married','Married'],['single','Single'],['divorced','Divorced'],['widowed','Widowed']],{cls:'c4',rerender:true})}
    ${seg('owner.children','Any children?',[['no','No'],['yes','Yes']],{cls:'c3',rerender:true})}
    ${o.children==='yes'?txt('owner.childCount','Number of children',{cls:'c2',max:2,mode:'numeric'}):''}
   </div></div></section>

  <section class="sec"><div class="sechd"><span class="step">2</span><h2>Nominees</h2><p>Up to 4. Shares must add up to 100%. DOB and gender fill in from a 12-digit NRIC.</p></div>
   <div class="secbd">${nomHtml}${S.nominees.length<4?`<div class="row" style="margin-top:14px"><button class="btn" data-act="addNom">Add nominee</button>${S.nominees.length>1?`<button class="btn ghost" data-act="split">Split shares equally</button>`:''}</div>`:''}</div></section>

  <section class="sec"><div class="sechd"><span class="step">3</span><h2>Trustees</h2><p>Part 2 of the form. Leave as "No change" if no trustee is needed.</p></div>
   <div class="secbd"><div class="grid" style="margin-bottom:${needT?'14px':'0'}">
    ${sel('trust.action','Trustee instruction',[['none','No change to trustees'],['appoint','Appoint the following trustee(s)'],['add','Appoint in addition to existing trustee(s)'],['replace','Revoke existing and appoint the following'],['revoke','Revoke all existing trustee(s)']],{cls:'c6',rerender:true})}
   </div>${trHtml}</div></section>

  <section class="sec"><div class="sechd"><span class="step">4</span><h2>Consent of existing nominees/trustees</h2><p>Part 3. Only needed when revoking a nomination that's already a trust policy.</p></div>
   <div class="secbd"><div class="grid" style="margin-bottom:${c.on?'14px':'0'}">${seg('consent.on','Include Part 3?',[['false','Not needed'],['true','Yes, fill consent details']],{cls:'c6',rerender:true})}</div>${conHtml}</div></section>

  <section class="sec"><div class="sechd"><span class="step">5</span><h2>Witness and signing</h2><p>Signatures stay blank for the client to sign.</p></div>
   <div class="secbd"><div class="grid">
    ${seg('sign.witType','Witness',[['agent','Agent'],['other','Someone else']],{cls:'c3',rerender:true})}
    ${date('sign.date','Signing date',{cls:'c3'})}
    ${s.witType==='agent'?`${txt('sign.agentName','Agent name',{cls:'c4'})}${txt('sign.agentIac','IAC no.',{cls:'c2',max:16})}`:`
     ${txt('sign.wit.name','Witness full name as per NRIC/passport',{cls:'c6'})}
     ${idFields('sign.wit')}
     ${date('sign.wit.dob','Witness date of birth',{cls:'c2'})}
     <div class="c4"></div>
     ${addrFields('sign.wit')}`}
   </div><p class="note">Leave the signing date empty to handwrite it on the day.</p></div></section>`;
  update();
}
// fix seg values for booleans
function readVal(el){if(el.dataset.k==='consent.on')return el.value==='true';return el.value}

/* ---------------- checks ---------------- */
const isSpouse=r=>r==='husband'||r==='wife', isChild=r=>r==='son'||r==='daughter', isParent=r=>r==='father'||r==='mother';
function computeChecks(){
  const L=[], o=S.owner, N=S.nominees, t=S.trust;
  const add=(lv,msg)=>L.push([lv,msg]);
  if(!o.name)add('err','Enter the policyowner name.');
  if(!alnum(S.proposalNo)&&!alnum(S.policyNo))add('err','Enter a proposal or policy number.');
  if(!o.muslim)add('err','Choose whether the policyowner is Muslim.');
  const total=N.reduce((a,n)=>a+(parseFloat(n.share)||0),0);
  if(Math.abs(total-100)<0.001)add('ok','Shares total 100%.');
  else add('err',`Shares total ${+total.toFixed(2)}%. They must add up to 100%.`);
  N.forEach((n,i)=>{const lab=`Nominee ${i+1}`;
    const miss=[];if(!n.name)miss.push('name');if(!n.id)miss.push('ID');if(!n.rel)miss.push('relationship');if(!n.dob)miss.push('date of birth');if(!n.gender)miss.push('gender');
    if(miss.length)add('err',`${lab}: missing ${miss.join(', ')}.`);
    if(n.name&&!fits(n.name,28,3))add('warn',`${lab}: name is too long for the boxes.`);
    {const a=addrOf(i).addr;if(a&&n.addrFrom==null&&!fits(a,32,3))add('warn',`${lab}: address is too long for 3 lines of boxes.`);}
    if(n.idType==='nric'&&n.id&&alnum(n.id).length!==12)add('warn',`${lab}: NRIC should be 12 digits.`);
    if(n.share&&String(parseFloat(n.share))!=='NaN'&&parseFloat(n.share)>100)add('err',`${lab}: share can't exceed 100%.`);
  });
  // nomination logic
  if(o.muslim&&N.some(n=>n.rel)){
    const noSpouseChild=o.status!=='married'&&o.children==='no';
    const qual=n=>isSpouse(n.rel)||isChild(n.rel)||(isParent(n.rel)&&noSpouseChild);
    const allQ=N.every(n=>n.rel&&qual(n));
    const anyParentBad=N.some(n=>isParent(n.rel))&&!noSpouseChild;
    if(o.muslim==='yes'){
      add('info','Muslim policyowner: nominees receive the money as executors, and it forms part of the estate.');
      if(t.action!=='none'&&t.action!=='revoke')add('warn','A Muslim policyowner should not appoint a trustee (Important Notice 4a).');
    } else if(allQ){
      add('info','This becomes a trust policy. The owner cannot revoke, surrender, assign or pledge it without the trustee\'s written consent.');
      if(t.action==='none'||t.action==='revoke')add('warn','A trustee other than the policyowner should be appointed (Important Notice 2).');
    } else {
      add('info','Some nominees are not spouse/child (or parent where there\'s no spouse/child), so they receive as executors. Consider an assignment if they should benefit.');
      if(t.action!=='none'&&t.action!=='revoke'&&!N.some(qual))add('warn','No trustee should be appointed for these nominees (Important Notice 4b).');
    }
    if(anyParentBad&&o.muslim==='no')add('info','A parent only counts as a statutory nominee when the owner has no spouse or children.');
  }
  if(['appoint','add','replace'].includes(t.action)){
    if(!t.trustees.length)add('err','Add at least one trustee, or change the trustee instruction.');
    const oid=alnum(o.id);
    t.trustees.forEach((p,i)=>{const lab=`Trustee ${i+1}`;
      if(!p.name||!p.id)add('err',`${lab}: missing name or ID.`);
      if(oid&&alnum(p.id)===oid)add('err',`${lab}: the policyowner cannot be their own trustee.`);
      if(p.name&&!fits(p.name,28,3))add('warn',`${lab}: name is too long for the boxes.`);
      if(p.addr&&!fits(p.addr,32,3))add('warn',`${lab}: address is too long for 3 lines of boxes.`);
    });
  }
  const s=S.sign;
  if(s.witType==='agent'){if(!s.agentName)add('warn','Enter the agent name for the witness blocks.');}
  else{const wid=alnum(s.wit.id);
    if(!s.wit.name||!s.wit.id)add('err','Witness: missing name or ID.');
    const others=[alnum(o.id),...N.map(n=>alnum(n.id)),...t.trustees.map(p=>alnum(p.id))].filter(Boolean);
    if(wid&&others.includes(wid))add('err','The witness cannot be the policyowner, a nominee or a trustee.');
    if(s.wit.name&&!fits(s.wit.name,28,2))add('warn','Witness name is too long for the boxes.');
  }
  if(o.name&&o.name.length>27)add('warn','Policyowner name is longer than the 27 boxes.');
  if(S.consent.on&&!S.consent.people.length)add('err','Add the people giving consent, or switch Part 3 off.');
  return L;
}
function pagesUsed(){const t=S.trust,tr=['appoint','add','replace'].includes(t.action);
  return {1:true,2:S.nominees.length>1,3:true,4:t.action!=='none',5:(t.action!=='none'&&S.sign.witType==='other')||S.consent.on};}
function update(){
  const L=computeChecks(); const ic={ok:'✓',warn:'!',err:'!',info:'i'};
  const order={err:0,warn:1,info:2,ok:3}; L.sort((a,b)=>order[a[0]]-order[b[0]]);
  document.getElementById('checks').innerHTML=L.map(([lv,m])=>`<li class="${lv}"><span class="dot">${ic[lv]}</span><span>${esc(m)}</span></li>`).join('');
  const ne=L.filter(x=>x[0]==='err').length;
  document.getElementById('checkCount').textContent=ne?`${ne} to fix`:'ready';
  const pu=pagesUsed();
  document.getElementById('pages').innerHTML=[1,2,3,4,5].map(p=>`<div class="pg ${pu[p]?'on':''}">Page ${p}</div>`).join('')+`<div class="note" style="flex-basis:100%;margin:4px 0 0">All 5 pages print. Highlighted pages get filled in.</div>`;
  document.querySelectorAll('[data-prev]').forEach(el=>{el.textContent=prevText(+el.dataset.prev)});
  lsSet(KEY_CUR,S);
}

/* ---------------- build fill values ---------------- */
function buildValues(){
  const V={cells:{},ticks:[],text:{}}, C=V.cells, T=V.ticks, X=V.text, o=S.owner;
  C.proposalNo=alnum(S.proposalNo); C.policyNo=alnum(S.policyNo);
  C['o.name']=o.name; C['o.nric']=alnum(o.id);
  if(o.muslim)T.push('o.muslim.'+o.muslim); if(o.status)T.push('o.status.'+o.status);
  if(o.children)T.push('o.children.'+o.children);
  if(o.children==='yes'&&o.childCount)C['o.childCount']=String(o.childCount).replace(/\D/g,'').padStart(2,'0');
  const person=(p,pre,natKey)=>{C[pre+'name']=p.name;C[pre+'nric']=alnum(p.id);
    if(p.idType==='passport')C[pre+'ppexp']=ddmmyy(p.ppexp);
    C[pre+'dob']=ddmmyy(p.dob); if(p.gender&&natKey)T.push(pre+'gender.'+p.gender);
    if(natKey){T.push(pre+'nat.'+(p.nat==='other'?'other':'malaysian')); if(p.nat==='other')C[pre+'natOther']=p.natOther;}
    C[pre+'addr']=p.addr.replace(/\s*\n\s*/g,', ');C[pre+'postcode']=p.postcode;C[pre+'town']=p.town;C[pre+'country']=p.country;};
  S.nominees.forEach((n0,i)=>{const n=Object.assign({},n0,addrOf(i));const pre=`n${i+1}.`;person(n,pre,true);
    if(n.rel)T.push(pre+'rel.'+n.rel); if(n.rel==='others')X[pre+'relOther']=n.relOther;
    const sh=parseFloat(n.share); if(!isNaN(sh)){const [a,b]=sh.toFixed(2).split('.');C[pre+'shareInt']=a.padStart(3,' ');C[pre+'shareDec']=b;}});
  const s=S.sign, agent=s.witType==='agent', wName=agent?s.agentName:s.wit.name, wIac=agent?s.agentIac:'';
  X['s3.ownerName']=o.name; X['s3.witName']=wName; X['s3.witIac']=wIac; if(s.date)C['s3.date']=ddmmyy(s.date);
  if(!agent){const w=s.wit;C['w3.name']=w.name;C['w3.nric']=alnum(w.id);if(w.idType==='passport')C['w3.ppexp']=ddmmyy(w.ppexp);C['w3.dob']=ddmmyy(w.dob);C['w3.addr']=w.addr.replace(/\s*\n\s*/g,', ');C['w3.postcode']=w.postcode;C['w3.town']=w.town;C['w3.country']=w.country;}
  const t=S.trust;
  if(t.action!=='none'){T.push('p2.'+t.action);
    X['s4.ownerName']=o.name; X['s4.witName']=wName; X['s4.witIac']=wIac; if(s.date)C['s4.date']=ddmmyy(s.date);
    if(!agent){for(const k of ['name','nric','ppexp','dob','addr','postcode','town','country'])if(C['w3.'+k]!=null)C['w5.'+k]=C['w3.'+k];}
    if(['appoint','add','replace'].includes(t.action))t.trustees.slice(0,2).forEach((p,i)=>{const pre=`t${i+1}.`;person(p,pre,true);
      T.push(pre+'cob.'+(p.cob==='other'?'other':'malaysia')); if(p.cob==='other')C[pre+'cobOther']=p.cobOther;
      C[pre+'tel']=String(p.tel||'').replace(/\D/g,''); C[pre+'telCountry']=p.telCountry; if(p.telType)T.push(pre+'telType.'+p.telType);
      X[`s4.t${i+1}Name`]=p.name;});
  }
  if(S.consent.on)S.consent.people.slice(0,4).forEach((p,i)=>{const pre=`c${i+1}.`;X[pre+'name']=p.name;X[pre+'nric']=p.id;if(agent){X[pre+'witName']=s.agentName;X[pre+'witIac']=s.agentIac;}});
  return V;
}
const LABELS={o:'Policyowner',n:'Nominee',t:'Trustee',w:'Witness'};
function warnLabel(k){const m=/^([ontw])(\d)?\.(\w+)/.exec(k);if(!m)return k;return `${LABELS[m[1]]}${m[1]==='n'||m[1]==='t'?' '+m[2]:''} ${m[3].replace('addr','address')}`}

/* ---------------- generate ---------------- */
let dlCap=null; (async()=>{try{if(window.claude&&window.claude.use)dlCap=await window.claude.use('downloads')}catch(e){dlCap=null}})();
async function generate(){
  const st=document.getElementById('genStatus'); st.className='status'; 
  const errs=computeChecks().filter(x=>x[0]==='err');
  if(errs.length&&!confirm(`${errs.length} item(s) still need fixing. Generate anyway?`))return;
  if(!window.PDFLib){st.className='status err';st.textContent='The PDF engine did not load. Check your connection and reload the page.';return;}
  st.textContent='Building PDF…';
  try{
    const bin=atob(PDF_B64), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const res=await fillForm(window.PDFLib,bytes,MAP,buildValues());
    const nm=(S.owner.name||'client').trim().replace(/[^A-Za-z0-9]+/g,'_').slice(0,40);
    const filename=`Nominee_Form_${nm}${alnum(S.policyNo||S.proposalNo)?'_'+alnum(S.policyNo||S.proposalNo):''}.pdf`;
    const blob=new Blob([res.bytes],{type:'application/pdf'});
    if(dlCap){
      try{await dlCap.save({filename,data:blob});st.className='status ok';st.textContent='Saved. Open it and print all pages.';}
      catch(e){if(e&&e.code==='declined'){st.textContent='Download cancelled.';}else{st.className='status err';st.textContent='Could not save the file here ('+(e&&e.code||'error')+').';}}
    }else if(window.claude&&window.claude.use){
      st.className='status err';st.textContent='This copy of the app can only download for signed-in members of the owner\'s Claude organization. Use the website version of the app instead.';return;
    }else{
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
      st.className='status ok';st.textContent='Downloaded. Open it and print all pages.';
    }
    if(res.warnings.length){st.className='status err';st.textContent+=' Some text was cut off: '+res.warnings.map(warnLabel).join(', ')+'.';}
  }catch(e){console.error(e);st.className='status err';st.textContent='Could not build the PDF: '+(e.message||e);}
}

/* ---------------- drafts ---------------- */
function renderDrafts(){const D=lsGet(KEY_DRAFTS)||[];const el=document.getElementById('drafts');
  el.innerHTML=D.length?D.map((d,i)=>`<div class="draft"><span class="nm">${esc(d.state.owner.name||'Untitled')}${d.state.policyNo||d.state.proposalNo?' · '+esc(d.state.policyNo||d.state.proposalNo):''}</span><span class="dt">${new Date(d.at).toLocaleDateString()}</span><button class="btn sm" data-act="loadD" data-i="${i}">Open</button><button class="btn ghost sm" data-act="delD" data-i="${i}" aria-label="Delete draft">Delete</button></div>`).join(''):'<div class="empty" style="padding:4px 0">No saved drafts. Drafts stay in this browser only.</div>';}
function saveDraft(){const D=lsGet(KEY_DRAFTS)||[];const i=D.findIndex(d=>d.state.id===S.id);const rec={at:Date.now(),state:JSON.parse(JSON.stringify(S))};if(i>=0)D[i]=rec;else D.unshift(rec);lsSet(KEY_DRAFTS,D.slice(0,50));renderDrafts();toast('Draft saved');}

/* ---------------- events ---------------- */
const main=document.getElementById('main');
main.addEventListener('input',e=>{const el=e.target;if(!el.dataset.k||el.type==='radio'||el.tagName==='SELECT')return;
  set(el.dataset.k,el.value);
  // NRIC autofill of DOB/gender
  const m=/^(nominees\.\d+|trust\.trustees\.\d+|sign\.wit)\.id$/.exec(el.dataset.k);
  if(m){const p=get(m[1]);if(p.idType==='nric'){const inf=nricInfo(p.id);if(inf){let ch=false;if(!p.dob){p.dob=inf.dob;ch=true}if(!p.gender&&m[1]!=='sign.wit'){p.gender=inf.gender;ch=true}if(ch){render();const f=main.querySelector(`[data-k="${el.dataset.k}"]`);if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}return;}}}}
  update();});
main.addEventListener('change',e=>{const el=e.target;if(!el.dataset.k)return;
  if(el.type==='radio'||el.tagName==='SELECT'){set(el.dataset.k,readVal(el));
    if(el.dataset.k==='trust.action'&&['appoint','add','replace'].includes(el.value)&&!S.trust.trustees.length)S.trust.trustees.push(blankTrustee());
    if(el.dataset.k==='consent.on'&&S.consent.on&&!S.consent.people.length)S.consent.people.push({name:'',id:''});
    if(el.dataset.rr){const y=window.scrollY;render();window.scrollTo(0,y);const f=main.querySelector(`[data-k="${el.dataset.k}"]${el.type==='radio'?`[value="${el.value}"]`:''}`);if(f)f.focus({preventScroll:true});}else update();}
  else{set(el.dataset.k,el.value);if(/^nominees\.\d+\.(addr|postcode|town|country)$/.test(el.dataset.k)&&S.nominees.length>1){const y=window.scrollY;render();window.scrollTo(0,y);}else update();}});
main.addEventListener('change',e=>{const el=e.target;if(el.dataset.addrsel==null)return;const i=+el.dataset.addrsel;const n=S.nominees[i];const y=window.scrollY;
  if(el.value==='own')unlinkAddr(i,true);else n.addrFrom=+el.value.slice(1);
  render();window.scrollTo(0,y);const f=main.querySelector(`[data-addrsel="${i}"]`);if(f)f.focus({preventScroll:true});});
main.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const i=+b.dataset.i;const y=window.scrollY;
  switch(b.dataset.act){
    case 'addNom':S.nominees.push(blankNominee());break;
    case 'delNom':{if(!confirm(`Remove nominee ${i+1}?`))return;const snap=S.nominees.map((_,k)=>addrOf(k));S.nominees.forEach((x,k)=>{if(x.addrFrom==null)return;if(addrRoot(k)===i||x.addrFrom===i){Object.assign(x,snap[k]);x.addrFrom=null;}});S.nominees.splice(i,1);S.nominees.forEach(x=>{if(x.addrFrom!=null&&x.addrFrom>i)x.addrFrom--;});break;}
    case 'split':{const n=S.nominees.length;const base=Math.floor(10000/n)/100;S.nominees.forEach((x,k)=>x.share=String(k===n-1?+(100-base*(n-1)).toFixed(2):base));break;}
    case 'addTr':S.trust.trustees.push(blankTrustee());break;
    case 'delTr':if(!confirm(`Remove trustee ${i+1}?`))return;S.trust.trustees.splice(i,1);break;
    case 'addCon':S.consent.people.push({name:'',id:''});break;
    case 'delCon':S.consent.people.splice(i,1);break;
  }render();window.scrollTo(0,y);});
document.getElementById('drafts').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const D=lsGet(KEY_DRAFTS)||[];const i=+b.dataset.i;
  if(b.dataset.act==='loadD'){S=JSON.parse(JSON.stringify(D[i].state));render();window.scrollTo(0,0);toast('Draft opened');}
  if(b.dataset.act==='delD'){if(!confirm('Delete this draft?'))return;D.splice(i,1);lsSet(KEY_DRAFTS,D);renderDrafts();}});
document.getElementById('btnSave').onclick=saveDraft;
document.getElementById('btnNew').onclick=()=>{if(!confirm('Start a new blank form? Unsaved changes to the current form will be lost.'))return;S=blankState();render();window.scrollTo(0,0);};
document.getElementById('btnGen').onclick=generate;
render();renderDrafts();
</script>
